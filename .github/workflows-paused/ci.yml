name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use the stand-in encoder, so the model's own packages are not needed here.
      - run: pip install "gradio==6.32.0" spaces      # `spaces` comes with every Space; here it is installed by hand
      - run: python -m unittest discover -s tests -v
